<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1112">
<title>異種孵化場 Xeno Hatchery｜原型 v0.5</title>
<link rel="icon" type="image/png" href="img/egg_tutorial.png?v=0.5">
<link rel="stylesheet" href="style.css?v=0.5">
</head>
<body>
<header id="top">
  <div class="hrow">
    <div class="brand"><img class="px logo" src="img/R-001.png?v=0.5" width="28" height="22" alt="">異種孵化場 <small>v0.5</small></div>
    <span id="online" class="chip online hidden" title="現在同時在玩的人數（約 2 分鐘內有開著遊戲的人）"></span>
    <button id="tbtn" class="chip round" title="測試工具">🧪</button>
  </div>
  <div id="res" class="res"></div>
  <div id="testbar" class="testbar hidden" aria-label="測試工具"></div>
</header>
<section id="penwrap">
  <div class="penbar"><b>飼養圈</b><span id="slotinfo"></span><span id="hungerinfo"></span><span id="bedinfo"></span></div>
  <div id="hint" class="hint"></div>
  <div class="penbox"><canvas id="pen" class="px" aria-label="飼養圈（點怪獸看詳情）"></canvas></div>
  <div id="feedrow" class="feedrow"></div>
  <div class="actions"><button id="bEgg" class="abtn"></button><button id="bFeed" class="abtn feed"></button><button id="bShip" class="abtn ship"></button></div>
  <div id="mlist" class="mlist"></div>
</section>
<main id="view" class="hidden"></main>
<nav id="tabs">
  <button data-tab="pen" class="on"><span>🏠</span>飼養圈</button>
  <button data-tab="dex"><span>📖</span>圖鑑</button>
  <button data-tab="shop"><span>🛒</span>商店</button>
  <button data-tab="tasks"><span>📋</span>任務</button>
  <button data-tab="rank"><span>🏆</span>排行</button>
</nav>
<div id="toast"></div>
<div id="sheet" class="hidden"></div>
<div id="cere" class="hidden"></div>
<script src="pen.js?v=0.5"></script>
<script src="game.js?v=0.5"></script>
<script src="online-config.js?v=0.5"></script>
<script src="online.js?v=0.5"></script>
</body>
</html>
