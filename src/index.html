<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1112">
<title>異種孵化場 Xeno Hatchery｜原型 v0.4</title>
<link rel="icon" type="image/png" href="img/egg_tutorial.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="hrow">
    <div class="brand"><img class="px logo" src="img/R-001.png" width="28" height="22" alt="">異種孵化場 <small id="ver">v0.4</small></div>

  </div>

<div id="testbar" class="testbar" aria-label="測試工具"></div>
<nav id="tabs">
  <button data-tab="lab" class="on"><span>🥚</span>孵化場</button>
  <button data-tab="dex"><span>📖</span>圖鑑</button>
  <button data-tab="shop"><span>🛒</span>商店</button>
  <button data-tab="inv"><span>🎒</span>背包</button>
  <button data-tab="tasks"><span>📋</span>任務</button>
</nav>
<main id="view"></main>
<div id="abar" class="abarw"></div>
<div id="toast"></div>
<div id="modal" class="hidden"></div>
<div id="guide" class="hidden"></div>
<div id="cere" class="hidden"></div>
<script src="sizes.js"></script>
<script src="game.js"></script>

<script src="online-config.js"></script>
